name: Docs

# Deploys the Sphinx site to GitHub Pages, with the PDF manual published
# alongside it at /shachen.pdf. The HTML build also runs in ci.yml on every
# pull request, so a broken page is caught before it reaches main; the PDF is
# built here and in release.yml, where a LaTeX failure blocks the release
# before anything reaches PyPI.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds the site and the PDF manual, and drops the PDF at the root of
      # the HTML tree, so the deployed site serves it at /shachen.pdf.
      - uses: ./.github/actions/build-docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
